<div class="dialog">
    <div class="dialog__visual">
        <img [src]="data.avatar" alt="{{ data.name }}">
        <div class="dialog__visual-info">
            
        </div>
    </div>
    <div class="dialog__info">
        <div class="dialog__header">
            <h2>{{ data.name }}</h2>
            <small>{{ data.role }}</small>
        </div>
        <div class="dialog__info-bio">   
            {{ data.bio }}
        </div>
    </div>
</div>
